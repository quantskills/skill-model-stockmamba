[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockmamba-skill"
version = "0.1.0"
description = "StockMamba-style multi-factor stock prediction and signal export"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
authors = [{name = "X-Tech-group", email = "xielinlin@x-tech.net.cn"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=12", "PyYAML>=6.0", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
